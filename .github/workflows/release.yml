name: Release

# Publica uma versão ao enviar uma tag vX.Y.Z:
#   imagem   ghcr.io/<dono>/kubeviz:X.Y.Z e :latest (amd64 e arm64, com SBOM)
#   chart    oci://ghcr.io/<dono>/charts/kubeviz, versão X.Y.Z
#   release  no GitHub, com notas geradas a partir dos commits
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v5

      - name: Versão
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/kubeviz:${{ steps.v.outputs.version }}
            ${{ env.REGISTRY }}/kubeviz:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}

      - uses: azure/setup-helm@v4

      - name: Helm chart
        run: |
          helm package deploy/helm/kubeviz --version "${{ steps.v.outputs.version }}" --app-version "${{ steps.v.outputs.version }}"
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "kubeviz-${{ steps.v.outputs.version }}.tgz" "oci://${{ env.REGISTRY }}/charts"

      - name: Release no GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "KubeViz $GITHUB_REF_NAME"
