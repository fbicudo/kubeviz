# Valores padrão do chart do KubeViz.

image:
  repository: ghcr.io/fbicudo/kubeviz
  # Vazio = appVersion do chart.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# As sessões ficam em memória: com mais de uma réplica, um usuário perderia a
# sessão ao cair em outro pod. Manter 1 até existir armazenamento compartilhado.
replicaCount: 1

# HTTPS servido pelo próprio KubeViz.
tls:
  enabled: true
  # Secret do tipo kubernetes.io/tls já existente (ex.: emitido pelo
  # cert-manager). O certificado é relido automaticamente quando renovado.
  secretName: ""
  # Sem secretName, o chart gera um certificado autoassinado, válido por um
  # ano: adequado apenas para testes (o navegador mostrará um aviso).
  selfSigned:
    dnsNames: []
    ipAddresses: []

service:
  type: ClusterIP
  # Padrão: 443 com TLS, 80 sem TLS.
  port: null
  nodePort: null

ingress:
  enabled: false
  className: ""
  host: kubeviz.example.com
  # Com tls.enabled, o Ingress precisa falar HTTPS com o pod. No ingress-nginx:
  #   nginx.ingress.kubernetes.io/backend-protocol: HTTPS
  annotations: {}
  # Secret TLS usado pelo Ingress para o domínio público.
  tlsSecretName: ""

logLevel: info
logFormat: json
sessionTTL: ""

# Login corporativo (OIDC), testado com Keycloak e Dex. O login por token do
# Kubernetes continua disponível.
oidc:
  enabled: false
  # Endereço do provedor, ex.: https://keycloak.exemplo.com/realms/empresa
  issuerURL: ""
  clientID: kubeviz
  # Secret já existente com o client secret (não guarde segredos nos values).
  clientSecret:
    existingSecret: ""
    key: client-secret
  # Endereço público de /auth/oidc/callback, registrado no provedor. Vazio =
  # https://<ingress.host>/auth/oidc/callback.
  redirectURL: ""
  # Dex: acrescente groups e offline_access (renovação do login).
  scopes: [openid, profile, email]
  usernameClaim: email
  groupsClaim: groups
  # Como a identidade chega ao cluster:
  #   impersonate: o KubeViz age pelo usuário (cabeçalhos Impersonate-*). Não
  #     exige configurar o API server; o chart dá à ServiceAccount a permissão
  #     "impersonate". Os prefixos evitam que alguém do provedor se passe por
  #     usuários ou grupos do cluster; use-os nos RoleBindings (ex.: oidc:dev).
  #   token: repassa o ID token; o API server precisa confiar no provedor
  #     (--oidc-issuer-url ou AuthenticationConfiguration). Prefixos ignorados.
  mode: impersonate
  usernamePrefix: "oidc:"
  groupsPrefix: "oidc:"
  # Nome do provedor no botão de login, ex.: Keycloak.
  displayName: ""
  # ConfigMap com a CA do provedor (chave ca.crt), se não for uma CA pública.
  caConfigMap: ""

serviceAccount:
  # Nome da ServiceAccount; vazio = nome do release.
  name: ""
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
