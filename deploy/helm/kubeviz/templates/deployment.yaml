apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubeviz.fullname" . }}
  labels:
    {{- include "kubeviz.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "kubeviz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubeviz.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "kubeviz.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: kubeviz
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: KUBEVIZ_MODE
              value: in-cluster
            - name: KUBEVIZ_LISTEN
              value: "0.0.0.0:4466"
            - name: KUBEVIZ_LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
            - name: KUBEVIZ_LOG_FORMAT
              value: {{ .Values.logFormat | quote }}
            {{- with .Values.oidc }}
            {{- if .enabled }}
            - name: KUBEVIZ_OIDC_ISSUER_URL
              value: {{ required "oidc.issuerURL é obrigatório com oidc.enabled" .issuerURL | quote }}
            - name: KUBEVIZ_OIDC_CLIENT_ID
              value: {{ .clientID | quote }}
            {{- if dig "clientSecret" "existingSecret" "" . }}
            - name: KUBEVIZ_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .clientSecret.existingSecret }}
                  key: {{ .clientSecret.key }}
            {{- end }}
            - name: KUBEVIZ_OIDC_REDIRECT_URL
              value: {{ include "kubeviz.oidcRedirectURL" $ | quote }}
            - name: KUBEVIZ_OIDC_SCOPES
              value: {{ join "," .scopes | quote }}
            - name: KUBEVIZ_OIDC_USERNAME_CLAIM
              value: {{ .usernameClaim | quote }}
            - name: KUBEVIZ_OIDC_GROUPS_CLAIM
              value: {{ .groupsClaim | quote }}
            - name: KUBEVIZ_OIDC_MODE
              value: {{ .mode | quote }}
            - name: KUBEVIZ_OIDC_USERNAME_PREFIX
              value: {{ .usernamePrefix | default "-" | quote }}
            - name: KUBEVIZ_OIDC_GROUPS_PREFIX
              value: {{ .groupsPrefix | default "-" | quote }}
            {{- with .displayName }}
            - name: KUBEVIZ_OIDC_DISPLAY_NAME
              value: {{ . | quote }}
            {{- end }}
            {{- if .caConfigMap }}
            - name: KUBEVIZ_OIDC_CA_FILE
              value: /etc/kubeviz/oidc-ca/ca.crt
            {{- end }}
            {{- end }}
            {{- end }}
            {{- $collector := dig "collector" dict (.Values.metrics | default dict) }}
            - name: KUBEVIZ_METRICS_COLLECTOR
              value: {{ dig "enabled" true $collector | quote }}
            - name: KUBEVIZ_METRICS_INTERVAL
              value: {{ dig "interval" "30s" $collector | quote }}
            - name: KUBEVIZ_METRICS_RETENTION
              value: {{ dig "retention" "720h" $collector | quote }}
            - name: KUBEVIZ_PROMETHEUS
              value: {{ dig "prometheus" "auto" (.Values.metrics | default dict) | quote }}
            - name: KUBEVIZ_DATA_DIR
              value: /var/lib/kubeviz
            {{- if .Values.tls.enabled }}
            - name: KUBEVIZ_TLS_CERT_FILE
              value: /etc/kubeviz/tls/tls.crt
            - name: KUBEVIZ_TLS_KEY_FILE
              value: /etc/kubeviz/tls/tls.key
            {{- end }}
          ports:
            - name: http
              containerPort: 4466
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
              scheme: {{ ternary "HTTPS" "HTTP" .Values.tls.enabled }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- $oidcCA := and (dig "enabled" false (.Values.oidc | default dict)) (dig "caConfigMap" "" (.Values.oidc | default dict)) }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kubeviz
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/kubeviz/tls
              readOnly: true
            {{- end }}
            {{- if $oidcCA }}
            - name: oidc-ca
              mountPath: /etc/kubeviz/oidc-ca
              readOnly: true
            {{- end }}
      volumes:
        {{- $persistence := .Values.persistence | default dict }}
        - name: data
          {{- if dig "enabled" false $persistence }}
          persistentVolumeClaim:
            claimName: {{ dig "existingClaim" "" $persistence | default (printf "%s-data" (include "kubeviz.fullname" .)) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "kubeviz.tlsSecretName" . }}
        {{- end }}
        {{- if $oidcCA }}
        - name: oidc-ca
          configMap:
            name: {{ $oidcCA }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
