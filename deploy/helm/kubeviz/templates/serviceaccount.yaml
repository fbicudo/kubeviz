# As ações dos usuários nunca usam a ServiceAccount do KubeViz: cada requisição
# chega à API com a identidade de quem entrou. A ServiceAccount só recebe (ver
# rbac.yaml): leitura de nós, pods e métricas para o coletor embutido
# (metrics.collector.enabled) e, com OIDC no modo impersonate, a permissão
# "impersonate".
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeviz.serviceAccountName" . }}
  labels:
    {{- include "kubeviz.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
