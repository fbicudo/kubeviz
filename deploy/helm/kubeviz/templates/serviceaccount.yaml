# A ServiceAccount do KubeViz não recebe nenhuma permissão no login por token:
# cada requisição chega à API com o token do próprio usuário, e o token montado
# no pod só serve para descobrir o endereço e a CA do cluster. A única exceção
# é o login OIDC no modo impersonate (ver rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeviz.serviceAccountName" . }}
  labels:
    {{- include "kubeviz.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
