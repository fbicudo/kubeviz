# A ServiceAccount do KubeViz não recebe nenhuma permissão (nenhum Role ou
# ClusterRole). Cada requisição chega à API com o token do próprio usuário que
# fez login; o token montado no pod só serve para descobrir o endereço e a CA
# do cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubeviz.serviceAccountName" . }}
  labels:
    {{- include "kubeviz.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
