{{- /* default dict: upgrades com --reuse-values de versões sem "oidc" */ -}}
{{- $oidc := .Values.oidc | default dict }}
{{- if and $oidc.enabled (eq ($oidc.mode | default "impersonate") "impersonate") }}
# Login OIDC no modo impersonate: o KubeViz age pelo usuário que entrou no
# provedor, com os cabeçalhos Impersonate-User e Impersonate-Group. Os nomes
# recebem os prefixos oidc.usernamePrefix e oidc.groupsPrefix, e o KubeViz
# recusa usuários e grupos system:*. Esta é a única permissão do KubeViz.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kubeviz.fullname" . }}-impersonate
  labels:
    {{- include "kubeviz.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kubeviz.fullname" . }}-impersonate
  labels:
    {{- include "kubeviz.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "kubeviz.fullname" . }}-impersonate
subjects:
  - kind: ServiceAccount
    name: {{ include "kubeviz.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
