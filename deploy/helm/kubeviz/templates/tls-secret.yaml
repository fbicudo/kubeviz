{{- if and .Values.tls.enabled (not .Values.tls.secretName) }}
{{- $name := include "kubeviz.tlsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
# Certificado autoassinado, apenas para testes. Reaproveitado entre upgrades.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "kubeviz.labels" . | nindent 4 }}
type: kubernetes.io/tls
data:
{{- if and $existing $existing.data }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
{{- else }}
{{- $svc := include "kubeviz.fullname" . }}
{{- $dns := concat (list "localhost" $svc (printf "%s.%s" $svc .Release.Namespace) (printf "%s.%s.svc" $svc .Release.Namespace)) .Values.tls.selfSigned.dnsNames }}
{{- $ips := concat (list "127.0.0.1") .Values.tls.selfSigned.ipAddresses }}
{{- $cert := genSelfSignedCert "kubeviz" $ips $dns 365 }}
  tls.crt: {{ $cert.Cert | b64enc }}
  tls.key: {{ $cert.Key | b64enc }}
{{- end }}
{{- end }}
